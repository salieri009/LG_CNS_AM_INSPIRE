# 로컬 개발용 MySQL. 실행: docker compose up -d  (backend 디렉터리에서)
# 스키마는 모듈별로 나누고(auth, production, diagnosis, guide, knowledge, record),
# 테이블과 시드는 앱이 뜰 때 Flyway가 만든다.
services:
  mysql:
    image: mysql:8.4
    container_name: repair-thread-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-repair}
      MYSQL_PASSWORD: ${DB_PASSWORD:-repair}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
